/* ---- pick the best seats for a party ---- */
function autoPickSeats(){
  const n = state.partySize || 2;
  const taken = window.__seatsTaken || [];
  const order = ['D','C','E','B','F','A','G'];
  let best = null;
  for(const row of order){
    for(let start=1; start+n-1<=7; start++){
      const block = Array.from({length:n},(_,i)=>row+(start+i));
      if(block.some(s=>taken.includes(s))) continue;
      const dist = Math.abs((start+(n-1)/2) - 4);
      if(!best || dist<best.dist) best = {dist, block};
    }
    if(best) break;
  }
  if(!best){
    const free = seatLayout().flatMap(r=>r.seats).filter(s=>!taken.includes(s));
    if(free.length<n){ toast(`Only ${free.length} seat${free.length===1?'':'s'} left for this showing`); return; }
    best = {block: free.slice(0,n)};
    toast('No seats together for that party size. Picked the first free seats.');
  }
  state.selectedSeats = best.block;
  renderBooking(taken);
}

/* ---- add to calendar (.ics) ---- */
function downloadICS(){
  const b = state.lastBooking; if(!b) return;
  const t = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec(String(b.time).trim());
  let h = 12, min = 0;
  if(t){ h = (+t[1])%12; if(t[3].toUpperCase()==='PM') h += 12; min = +t[2]; }
  const [Y,M,D] = b.date.split('-').map(Number);
  const start = new Date(Y, M-1, D, h, min);
  const end = new Date(start.getTime() + (b.duration||120)*60000);
  const p2 = n=>String(n).padStart(2,'0');
  const f = d=>`${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}T${p2(d.getHours())}${p2(d.getMinutes())}00`;
  const esc = s=>String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ticketing//EN','BEGIN:VEVENT',
    `UID:${b.code}@cks-ticketing`,`DTSTAMP:${f(new Date())}`,`DTSTART:${f(start)}`,`DTEND:${f(end)}`,
    `SUMMARY:${esc('Movie: '+b.title)}`,
    `LOCATION:${esc(SITE.location)}`,
    `DESCRIPTION:${esc('Seats '+b.seats.join(', ')+'\nCode '+b.code+'\nFree reservation')}`,
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  a.download = `${b.code}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---- admin notification bell ---- */
const SEEN_KEY = 'cks_admin_seen';
function getSeen(){ try{ return localStorage.getItem(SEEN_KEY)||''; }catch(e){ return ''; } }
function setSeen(v){ try{ localStorage.setItem(SEEN_KEY, v); }catch(e){} }
function timeAgo(iso){
  const s = Math.max(1, Math.round((Date.now()-new Date(iso).getTime())/1000));
  if(s<60) return 'just now';
  const m = Math.round(s/60); if(m<60) return m+' min ago';
  const h = Math.round(m/60); if(h<24) return h+' h ago';
  return Math.round(h/24)+' d ago';
}
async function pollAdminNotifications(first){
  if(!state.isAdmin) return;
  try{
    const { reservations } = await api('GET','/reservations');
    const list = [...reservations].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
    let seen = getSeen();
    if(!seen){ seen = new Date().toISOString(); setSeen(seen); }
    const fresh = list.filter(r=>String(r.createdAt) > seen);
    if(!state.knownIds) state.knownIds = new Set(list.map(r=>r.id));
    const brandNew = list.filter(r=>!state.knownIds.has(r.id));
    list.forEach(r=>state.knownIds.add(r.id));
    state.notifs = list.slice(0,8);
    state.newIds = new Set(fresh.map(r=>r.id));
    state.unread = fresh.length;
    if(!first){
      brandNew.forEach(r=>{
        const msg = `${r.name} reserved ${r.seats.join(', ')} for ${r.movieTitle}`;
        toast('New reservation: '+msg, 5000);
        notifyBrowser('New CKS reservation', msg);
      });
    }
    updateNotifUI();
    if(state.view==='admin' && state.adminTab==='reservations' && brandNew.length && !document.querySelector('.overlay.open')){
      loadAdminReservations();
    }
  }catch(e){}
}

function scrambleText(el, text){
  clearInterval(el.__scr);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = text; return; }
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*';
  let frame = 0; const total = 18;
  el.__scr = setInterval(()=>{
    frame++;
    const reveal = Math.floor(text.length*frame/total);
    el.textContent = text.split('').map((c,i)=> c===' ' ? ' ' : (i<reveal ? c : chars[Math.floor(Math.random()*chars.length)])).join('');
    if(frame>=total){ clearInterval(el.__scr); el.textContent = text; }
  }, 35);
}

  if(!d || d.childElementCount || REDUCED_MOTION) return;
  let h = '';
  for(let i=0;i<24;i++){
    const size = (Math.random()*2+1.5).toFixed(1);
    h += `<i style="left:${(45+Math.random()*55).toFixed(1)}%;top:${(25+Math.random()*75).toFixed(1)}%;width:${size}px;height:${size}px;--d:${(10+Math.random()*10).toFixed(1)}s;--dl:${(-Math.random()*14).toFixed(1)}s;--dx:${(Math.random()*60-30).toFixed(0)}px"></i>`;
  }

}

function initReveal(){
  if(REDUCED_MOTION || !('IntersectionObserver' in window) || state.view==='admin' || !state.revealOnce) return;
  state.revealOnce = false;
  document.documentElement.classList.add('js-reveal');
  if(!window._rvIO){
    window._rvIO = new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.add('in'); window._rvIO.unobserve(e.target); }
    }), {threshold:0.06, rootMargin:'0px 0px -5% 0px'});
  }
  document.querySelectorAll('main section:not(.hero), main .movie-card, main .cs-card').forEach((el,i)=>{
    if(el.hasAttribute('data-rv')) return;
    el.setAttribute('data-rv','');
    el.style.transitionDelay = ((i%5)*70)+'ms';
    window._rvIO.observe(el);
  });
}

  scrambleText(title, m.title);

  const htb = document.getElementById('heroTrailerBtn'); if(htb) htb.style.display = m.trailer ? '' : 'none';
  const hbg = document.getElementById('heroBg');
  if(hbg){ hbg.style.opacity = 0; setTimeout(()=>{ hbg.style.backgroundImage = heroBgImage(m); hbg.style.opacity = ''; }, 380); }
  const card = document.getElementById('heroCard');
  if(card){
    card.innerHTML = posterHTML(m);
    card.classList.remove('swap'); void card.offsetWidth; card.classList.add('swap');
  }
  document.querySelectorAll('#heroDots .hero-dot').forEach((d,idx)=>d.classList.toggle('active', idx===state.featuredIdx));
  if(byUser) restartHeroTimer();
}
function restartHeroTimer(){
  clearInterval(window.__heroTimer);
  window.__heroTimer = setInterval(()=>{
    if(state.view!=='home' || !document.getElementById('heroTitle') || window.__heroHover || document.querySelector('.overlay.open')) return;
    setFeatured((state.featuredIdx||0)+1);
  }, 6500);
}
document.addEventListener('mouseover', e=>{ window.__heroHover = !!(e.target.closest && e.target.closest('.hero')); });

function renderHUD(){
  const el = document.getElementById('hud');
  if(!el) return;
  const showing = state.movies.filter(m=>m.status==='showing');
  const today = todayPlus(0);
  let shows = 0, left = 0;
  showing.forEach(m=>m.showtimes.filter(s=>s.date===today).forEach(s=>{ shows++; left += Math.max(0, seatsLeft(m,s)); }));
  const now = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit',timeZone:'Asia/Manila'})+' PHT';
  el.innerHTML = `<span class="hud-dot"></span><span>Live</span><span>${now}</span><span><b>${showing.length}</b> movies showing</span><span><b>${shows}</b> shows today</span>${bookingOpen()?`<span><b>${left}</b> seats open today</span>`:`<span style="color:var(--red)"><b>Reservations closed</b></span>`}`;
}


/* ---- mobile menu ---- */

function toggleMobileNav(e){

/* ---- movie pop-up with poster beside the details ---- */
function openMovie(id, autoplay){
  const m = state.movies.find(x=>x.id===id);
  if(!m) return;
  const days = [...new Set(m.showtimes.map(s=>s.date))].sort();
  const showtimes = days.length ? days.map(d=>`
      <div style="margin-bottom:14px;">
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">${fmtDate(d)}</div>
        <div class="times">${m.showtimes.filter(s=>s.date===d).map(st=>timePill(m,st)).join('')}</div>
      </div>`).join('') : `<div class="empty">No showtimes yet. Check back soon.</div>`;
  document.getElementById('movieModal').innerHTML = `
    <div class="modal-head"><h3>${m.title}</h3><button class="modal-close" onclick="closeOverlay('movieOverlay')">&times;</button></div>
    <div class="modal-body">
      <div id="trailerBox"></div>
      <div class="movie-detail">
        <div class="md-poster">${posterHTML(m)}</div>
        <div class="md-info">
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
            <span class="rating-chip">${m.rating}</span>
            <span style="color:var(--muted);font-size:12px;">${m.genre}</span>
            ${m.duration?`<span style="color:var(--muted);font-size:12px;">${formatDuration(m.duration)}</span>`:''}
          </div>
          <p class="synopsis" style="margin-top:12px;">${m.synopsis}</p>
          ${m.trailer?`<button class="btn btn-ghost btn-sm" style="margin-top:14px;" onclick="playTrailer('${m.id}')">&#9654; Watch Trailer</button>`:''}
          ${m.status==='showing'
            ? `<div style="margin-top:18px;"><div class="eyebrow">Pick a showtime</div>${showtimes}</div>`
            : `<div class="release-pill" style="margin-top:16px;">In theaters ${m.release?fmtDate(m.release):'TBA'}</div>`}
        </div>
      </div>
    </div>`;
  openOverlay('movieOverlay');
  if(autoplay && m.trailer) playTrailer(id);
}


/* ---- upload a trailer video from the admin's computer ---- */
const TRAILER_MAX = 60*1024*1024;
function trailerFieldChanged(){
  const v = document.getElementById('edTrailer').value.trim();
  const c = document.getElementById('trailerClear'); if(c) c.style.display = v ? '' : 'none';
  const st = document.getElementById('trailerStatus');
  if(st) st.textContent = v.startsWith('/api/videos/') ? 'Uploaded video attached.' : 'MP4 or WebM, up to 60 MB.';
}
function clearTrailer(){
  document.getElementById('edTrailer').value = '';
  const f = document.getElementById('edTrailerFile'); if(f) f.value = '';
  trailerFieldChanged();
}
async function uploadTrailerFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const st = document.getElementById('trailerStatus');
  const prog = document.getElementById('trailerProgress'), bar = document.getElementById('trailerBar');
  const fail = msg=>{ st.textContent = msg; st.style.color = 'var(--red)'; prog.style.display='none'; input.value=''; toast(msg); };
  st.style.color = 'var(--muted)';
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  const mime=/^video\/(mp4|webm)$/.test(file.type)?file.type:(ext==='mp4'||ext==='m4v'?'video/mp4':ext==='webm'?'video/webm':'');
  if(!mime) return fail(`"${file.name}" is not MP4 or WebM (${file.type||ext||'unknown type'}). Convert it to MP4 first.`);
  if(file.size > TRAILER_MAX) return fail(`That video is ${(file.size/1048576).toFixed(0)} MB. The limit is 60 MB. Compress it or paste a YouTube link instead.`);
  try{
    prog.style.display = 'block'; bar.style.width = '0';
    st.textContent = 'Starting upload…';
    const { id, chunkSize } = await api('POST','/videos/start',{ mime, size:file.size, name:file.name });
    const total = Math.ceil(file.size / chunkSize);
    for(let i=0;i<total;i++){
      let ok = false, lastErr = '';
      for(let attempt=0; attempt<3 && !ok; attempt++){
        try{
          const r = await fetch(`/api/videos/${id}/chunk?i=${i}`, {
            method:'PUT', headers:{'Content-Type':'application/octet-stream'}, credentials:'same-origin',
            body: file.slice(i*chunkSize, (i+1)*chunkSize)
          });
          if(r.ok) ok = true; else { const d = await r.json().catch(()=>({})); lastErr = d.error || 'Upload failed'; }
        }catch(e){ lastErr = "Can't reach the server."; }
      }
      if(!ok) return fail(lastErr + ' Please try again.');
      bar.style.width = Math.round(((i+1)/total)*100)+'%';
      st.textContent = `Uploading… ${Math.round(((i+1)/total)*100)}%`;
    }
    const done = await api('POST', `/videos/${id}/finish`, { chunks: total });
    document.getElementById('edTrailer').value = done.url;
    st.textContent = `Uploaded ${file.name} (${(file.size/1048576).toFixed(1)} MB). Press Save to keep it.`;
    st.style.color = 'var(--green)';
    prog.style.display = 'none';
    trailerFieldChanged();
    st.textContent = `Uploaded ${file.name} (${(file.size/1048576).toFixed(1)} MB). Press Save to keep it.`;
  }catch(e){ fail(e.message); }
}

/* ---- trailers ---- */
function trailerEmbed(raw){
  if(/^\/api\/videos\/v_[a-f0-9]{16}$/.test(raw)) return {type:'video', src:raw};
  let u; try{ u = new URL(raw); }catch(e){ return null; }
  if(!/^https?:$/.test(u.protocol)) return null;
  const h = u.hostname.replace(/^(www|m)\./,'');
  let id = null;
  if(h==='youtu.be') id = u.pathname.slice(1).split('/')[0];
  else if(h==='youtube.com' || h==='youtube-nocookie.com'){
    if(u.pathname==='/watch') id = u.searchParams.get('v');
    else { const mm = u.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]{6,})/); if(mm) id = mm[2]; }
  }
  if(id && /^[\w-]{6,15}$/.test(id)) return {type:'iframe', src:`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`};
  if(h==='vimeo.com'){ const mm = u.pathname.match(/\/(\d+)/); if(mm) return {type:'iframe', src:`https://player.vimeo.com/video/${mm[1]}?autoplay=1`}; }
  if(h==='drive.google.com'){ const mm = u.pathname.match(/\/file\/d\/([\w-]+)/); if(mm) return {type:'iframe', src:`https://drive.google.com/file/d/${mm[1]}/preview`}; }
  if(h==='facebook.com' || h==='fb.watch') return {type:'iframe', src:`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(raw)}&show_text=false&autoplay=1`};
  if(/\.(mp4|webm|ogg)$/i.test(u.pathname)) return {type:'video', src:raw};
  return null;
}
function playTrailer(id){
  const m = state.movies.find(x=>x.id===id);
  const box = document.getElementById('trailerBox');
  if(!m || !m.trailer || !box) return;
  const e = trailerEmbed(m.trailer);
  if(!e){ window.open(m.trailer, '_blank', 'noopener'); return; }
  box.innerHTML = `
    <div class="trailer-frame">
      ${e.type==='iframe'
        ? `<iframe src="${escAttr(e.src)}" title="${escAttr(m.title)} trailer" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`
        : `<video src="${escAttr(e.src)}" controls autoplay playsinline></video>`}
      <button class="trailer-x" onclick="stopTrailer()">Close &#10005;</button>
    </div>`;
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function stopTrailer(){ const box = document.getElementById('trailerBox'); if(box) box.innerHTML = ''; }
function openFeaturedTrailer(){
  const m = featuredList()[state.featuredIdx||0];
  if(m) openMovie(m.id, true);
}

async function loadMovies(){
  const { movies } = await api('GET','/movies');
  state.movies = sortMovies(movies);
}
async function init(){
  applySite();
  await loadSite();
  try{ await loadMovies(); }catch(e){ toast('Could not load movies from the server'); }
  await loadAvailability();
  setInterval(refreshLive, 30000);
  setInterval(renderHUD, 1000);
  restartHeroTimer();
  try{ const { user } = await api('GET','/auth/me'); state.currentUser = user; }catch(e){}
  await refreshAdminStatus();
  document.querySelectorAll('nav.primary button').forEach(b=>{ b.classList.toggle('active', b.dataset.view==='home'); });
  render();
  handleUrlActions();
  try{ if(!sessionStorage.getItem('cks_visit')){ sessionStorage.setItem('cks_visit','1'); api('POST','/stats/visit',{}).catch(()=>{}); } }catch(e){}
  setupA11y();
}

   LANGUAGE (English / Filipino, and Kapampangan when public/i18n-pam.js is filled in)
   Texts are swapped after each screen is drawn; anything not listed stays in English.

  'Home':'Home','About':'Tungkol sa Amin','Schedule':'Iskedyul','Coming Soon':'Malapit Nang Ipalabas','My Ticket':'Aking Tiket',
  'Contact Us':'Makipag-ugnayan','Privacy':'Privacy','Staff':'Kawani','Now Showing':'Ipinapalabas Ngayon','Book Now':'Magpareserba Na',
  'Today':'Ngayon','Free reservation':'Libreng reserbasyon','Reserve a Seat':'Magpareserba ng Upuan',"See What's Coming":'Tingnan ang Susunod',
  'Full name':'Buong pangalan','Confirm Booking':'Kumpirmahin ang Pagpapareserba','Confirm Reservation':'Kumpirmahin ang Reserbasyon',
  'Reserve Seats':'Reserbahin ang mga Upuan','Pick best seats':'Piliin ang pinakamagandang upuan','Party of':'Bilang ng tao',
  'Screen this way':'Nasa dakong ito ang screen','Available':'Bakante','Selected':'Napili','Taken':'Okupado na','Close':'Isara',
  'Join the Waitlist':'Sumali sa Waitlist','Notify me':'Abisuhan ako','Waitlist':'Waitlist','Full':'Puno','Closed':'Sarado','Started':'Nagsimula na',
  'Reservations closed':'Sarado ang reserbasyon','Privacy Notice':'Paunawa sa Privacy','Read the privacy notice':'Basahin ang paunawa sa privacy',
  'Your Ticket':'Iyong Tiket',"You're In":'Naka-reserba Ka Na','Add to calendar':'Idagdag sa kalendaryo','Full ticket':'Buong tiket',
  'Print / Save PDF':'I-print / I-save bilang PDF','Name':'Pangalan','Email':'Email','Ticket code':'Code ng tiket','Phone number':'Numero ng telepono',
  'Find my ticket':'Hanapin ang aking tiket','Send Message':'Ipadala ang Mensahe','Message':'Mensahe','Loading seat map…':'Kinukuha ang mapa ng upuan…',
  'Selected seats':'Mga napiling upuan','Free':'Libre','Booked':'Naka-book','Showtimes':'Oras ng Palabas','Trailer':'Trailer','Watch trailer':'Panoorin ang trailer',
  'No showtimes scheduled for this day yet.':'Wala pang palabas na naka-iskedyul sa araw na ito.','Nothing on the schedule yet — check back soon.':'Wala pang nakalistang palabas. Bumalik muli sa lalong madaling panahon.',
  'Inside the Theater':'Sa Loob ng Sinehan','Take a look inside.':'Silipin ang loob.','Release date':'Petsa ng pagpapalabas','Staff Panel':'Panel ng Kawani',
  'Enter your name.':'Ilagay ang iyong pangalan.','Seats reserved':'Naka-reserba na ang mga upuan'
};
const I18N_RULES_FIL = [
  [/^(\d+) left$/, '$1 na lang'],
  [/^(\d+) of (\d+) seats left$/, '$1 sa $2 upuan ang natitira'],
  [/^(\d+) seats left$/, '$1 upuan ang natitira'],
  [/^Seats: (.+)$/, 'Mga upuan: $1'],
  [/^Admit (\d+)$/i, 'Pasok $1']
];
let LANG = 'en';
try{ LANG = localStorage.getItem('cks_lang') || 'en'; }catch(e){}
function langTable(){ return LANG==='fil' ? I18N_FIL : (LANG==='pam' ? (window.CKS_PAM||{}) : null); }
function trText(str){
  const t = langTable(); if(!t) return null;
  const k = str.trim(); if(!k) return null;
  let out = t[k];
  if(out===undefined && LANG==='fil'){ for(const [re,to] of I18N_RULES_FIL){ if(re.test(k)){ out = k.replace(re,to); break; } } }
  if(out===undefined) return null;
  return str.replace(k, out);
}
function applyLang(root){
  const base = root || document.body, w = document.createTreeWalker(base, NodeFilter.SHOW_TEXT, {
    acceptNode:n=>/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode&&n.parentNode.nodeName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT });
  let n; const nodes=[]; while((n=w.nextNode())) nodes.push(n);
  nodes.forEach(node=>{
    if(node.__orig===undefined){ if(LANG==='en') return; node.__orig = node.nodeValue; }
    else if(node.nodeValue!==node.__tr && node.nodeValue!==node.__orig){ node.__orig = node.nodeValue; } // text changed by the page
    const out = LANG==='en' ? null : trText(node.__orig);
    const next = out===null ? node.__orig : out;
    if(node.nodeValue!==next) node.nodeValue = next;
    node.__tr = next;
  });
  (base.querySelectorAll ? base.querySelectorAll('[placeholder],[aria-label],[title]') : []).forEach(el=>{
    ['placeholder','aria-label','title'].forEach(a=>{
      if(!el.hasAttribute(a)) return;
      const key='data-o-'+a; if(!el.hasAttribute(key)){ if(LANG==='en') return; el.setAttribute(key, el.getAttribute(a)); }
      const o = el.getAttribute(key), out = LANG==='en' ? null : trText(o);
      el.setAttribute(a, out===null ? o : out);
    });
  });
  document.documentElement.lang = LANG==='fil' ? 'fil' : (LANG==='pam' ? 'pam' : 'en');
  const b = document.getElementById('langBtn'); if(b) b.textContent = LANG==='fil' ? 'FIL' : (LANG==='pam' ? 'KAP' : 'EN');
}
function availableLangs(){ return ['en','fil'].concat(Object.keys(window.CKS_PAM||{}).length ? ['pam'] : []); }
function cycleLang(){
  const l = availableLangs(); LANG = l[(l.indexOf(LANG)+1) % l.length];
  try{ localStorage.setItem('cks_lang', LANG); }catch(e){}
  applyLang(); toast(LANG==='fil'?'Wika: Filipino':(LANG==='pam'?'Wika: Kapampangan':'Language: English'));
}

// Accessibility: dialogs, live toast, and labels tied to their inputs.
function linkLabels(root){
  (root||document).querySelectorAll('.field').forEach(f=>{
    const l = f.querySelector('label'), c = f.querySelector('input,select,textarea');
    if(!l || !c || l.htmlFor || l.contains(c)) return;
    if(!c.id) c.id = 'f_'+Math.random().toString(36).slice(2,9);
    l.htmlFor = c.id;
  });
}
function setupA11y(){
  const modal = document.getElementById('movieModal'); if(modal){ modal.setAttribute('role','dialog'); modal.setAttribute('aria-modal','true'); modal.setAttribute('aria-label','Dialog'); }
  const t = document.getElementById('toast'); if(t){ t.setAttribute('role','status'); t.setAttribute('aria-live','polite'); }
  document.querySelectorAll('.modal-close').forEach(b=>{ if(!b.getAttribute('aria-label')) b.setAttribute('aria-label','Close'); });
  let tm; new MutationObserver(()=>{ clearTimeout(tm); tm=setTimeout(()=>{ linkLabels(document); document.querySelectorAll('.modal-close:not([aria-label])').forEach(b=>b.setAttribute('aria-label','Close')); if(LANG!=='en') applyLang(); },60); }).observe(document.body,{childList:true,subtree:true});
  linkLabels(document);
  if(LANG!=='en') applyLang();
  const pam=document.createElement('script'); pam.src='/i18n-pam.js'; pam.onload=()=>{ if(LANG==='pam') applyLang(); }; document.head.appendChild(pam);
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
function cleanUrlParam(key){
  const url = new URL(window.location.href);
  url.searchParams.delete(key);
  window.history.replaceState({}, '', url.pathname + url.search);
}
init();
